<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Private Intake · Curator Atelier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Private intake for Curator Atelier prestige engagements. Discreet, controlled, and allocation-based." />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- OG -->
  <meta property="og:title" content="Private Intake · Curator Atelier" />
  <meta property="og:description" content="Request private allocation for high-stakes personal engagements." />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#040908;--panel:#0b1915;--accent:#c9a24b;
      --text:#f6f1e5;--muted:#a7b0aa;--border:#22302a;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:'Inter',sans-serif;
      background:radial-gradient(circle at top,#172620 0,#020504 55%,#010303 100%);
      color:var(--text);line-height:1.6;
    }
    .page{max-width:820px;margin:0 auto;padding:2.6rem 1.25rem 4rem;}
    a{text-decoration:none;color:inherit}

    h1,h2{font-family:'Playfair Display',serif;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
    h1{font-size:2.2rem;margin-bottom:.8rem}
    h2{font-size:1.35rem;margin-bottom:.6rem}

    .intro{font-size:.95rem;color:var(--muted);max-width:42rem;margin-bottom:2.2rem}

    .panel{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:22px;
      padding:1.6rem;
    }

    label{font-size:.75rem;color:var(--muted);display:block;margin-bottom:.2rem}
    input,select,textarea{
      width:100%;border-radius:10px;border:1px solid var(--border);
      background:#030505;color:var(--text);
      padding:.6rem .75rem;font-size:.8rem;
    }
    textarea{min-height:100px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.9rem}

    .btn{
      margin-top:1rem;
      display:inline-flex;align-items:center;justify-content:center;
      border-radius:999px;padding:.6rem 1.4rem;
      font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;
      background:linear-gradient(135deg,#c9a24b,#f4e0a4);
      color:#151109;border:none;cursor:pointer;
    }

    .note{
      margin-top:1rem;
      font-size:.75rem;color:var(--muted);
    }
  </style>

  <script>
    function trackPrivateIntake(){
      if (typeof fbq !== 'undefined') fbq('track','Lead',{content_name:'Private Intake'});
      if (typeof gtag !== 'undefined') gtag('event','private_intake_submit');
    }
  </script>
</head>

<body>
<div class="page">

<h1>Private Intake</h1>
<p class="intro">
This intake is reserved for private individuals seeking discreet,
high-stakes execution. Submissions are reviewed personally.
</p>

<div class="panel">
  <form method="POST"
        action="https://formspree.io/f/xblwkzyq"
        onsubmit="trackPrivateIntake()">

    <div class="grid">
      <div>
        <label>Full Name</label>
        <input name="name" required />
      </div>
      <div>
        <label>Email</label>
        <input type="email" name="email" required />
      </div>
      <div>
        <label>Phone</label>
        <input name="phone" />
      </div>
      <div>
        <label>Engagement Type</label>
        <select name="type">
          <option>Proposal / Milestone</option>
          <option>Anniversary / Repair</option>
          <option>Private Experience</option>
          <option>Unsure</option>
        </select>
      </div>
    </div>

    <div class="grid" style="margin-top:.8rem">
      <div>
        <label>Working Budget</label>
        <input name="budget" placeholder="$7,500 – $25,000+" />
      </div>
      <div>
        <label>Timeline / Date</label>
        <input name="timeline" placeholder="Specific date or window" />
      </div>
    </div>

    <div style="margin-top:.8rem">
      <label>Context & Stakes</label>
      <textarea name="context"
        placeholder="What cannot go wrong? What matters most?"></textarea>
    </div>

    <button class="btn" type="submit">Request Allocation</button>

    <p class="note">
      If aligned, you’ll receive next steps or a brief scheduling link.
    </p>
  </form>
</div>

</div>
</body>
</html>
